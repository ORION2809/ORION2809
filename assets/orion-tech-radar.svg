<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="tr-title tr-desc">
  <title id="tr-title">ORION2809 Tech Stack Radar</title>
  <desc id="tr-desc">Animated hexagonal tech radar showing AI, Runtime, Frontend, and Proof competencies with orbital rings.</desc>
  <defs>
    <linearGradient id="trbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#03120b"/>
    </linearGradient>
    <linearGradient id="trneon" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.4" stop-color="#06b6d4"/>
      <stop offset="0.7" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="trcore" cx="50%" cy="50%" r="40%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="trgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#22c55e" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
    <filter id="trglow" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="trsmall" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .trmono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .trlabel{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:3px}
      .trspin1{animation:trspin 20s linear infinite;transform-origin:600px 290px}
      .trspin2{animation:trspin 30s linear infinite reverse;transform-origin:600px 290px}
      .trpulse{animation:trpulse 2.5s ease-in-out infinite}
      .trhex{animation:trhex 3s ease-in-out infinite}
      @keyframes trspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      @keyframes trpulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes trhex{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#trbg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#trgrid)"/>
  <rect width="1200" height="520" rx="24" fill="url(#trcore)"/>

  <!-- Title -->
  <text x="44" y="50" class="trmono" fill="#22c55e" font-size="18" filter="url(#trsmall)">STACK RADAR // COMPETENCY MAP</text>

  <!-- Central radar rings -->
  <g opacity="0.35">
    <circle cx="600" cy="290" r="200" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="600" cy="290" r="150" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3 6"/>
    <circle cx="600" cy="290" r="100" fill="none" stroke="#8b5cf6" stroke-width="0.6" stroke-dasharray="2 5"/>
    <circle cx="600" cy="290" r="50" fill="none" stroke="#f97316" stroke-width="0.5"/>
  </g>

  <!-- Spinning orbital dots -->
  <g class="trspin1" opacity="0.5">
    <circle cx="800" cy="290" r="4" fill="#22c55e"/>
    <circle cx="400" cy="290" r="3" fill="#06b6d4"/>
    <circle cx="600" cy="90" r="3.5" fill="#f97316"/>
    <circle cx="600" cy="490" r="2.5" fill="#8b5cf6"/>
  </g>
  <g class="trspin2" opacity="0.35">
    <circle cx="741" cy="131" r="3" fill="#22c55e"/>
    <circle cx="459" cy="449" r="2.5" fill="#06b6d4"/>
  </g>

  <!-- Cross lines -->
  <line x1="600" y1="90" x2="600" y2="490" stroke="#22c55e" stroke-opacity="0.1" stroke-width="0.5"/>
  <line x1="400" y1="290" x2="800" y2="290" stroke="#06b6d4" stroke-opacity="0.1" stroke-width="0.5"/>

  <!-- AI Quadrant (top-left) -->
  <g transform="translate(60 80)" filter="url(#trsmall)">
    <rect width="230" height="180" rx="14" fill="#020617" fill-opacity="0.85" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect width="230" height="36" rx="14" fill="#22c55e" fill-opacity="0.06"/>
    <text x="16" y="24" class="trlabel" fill="#22c55e" font-size="14">AI &amp; AGENTS</text>
    <circle cx="210" cy="18" r="4" fill="#22c55e" class="trpulse"/>
    <line x1="0" y1="36" x2="230" y2="36" stroke="#22c55e" stroke-opacity="0.2"/>
    <g class="trmono" font-size="13" fill="#d1fae5">
      <text x="16" y="62">OpenAI / Anthropic</text>
      <text x="16" y="84">NVIDIA NIM</text>
      <text x="16" y="106">RAG Pipelines</text>
      <text x="16" y="128">MCP Servers</text>
      <text x="16" y="150">Multi-Agent Swarms</text>
      <text x="16" y="172">Eval-Driven Dev</text>
    </g>
  </g>

  <!-- Runtime Quadrant (top-right) -->
  <g transform="translate(910 80)" filter="url(#trsmall)">
    <rect width="230" height="180" rx="14" fill="#020617" fill-opacity="0.85" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect width="230" height="36" rx="14" fill="#06b6d4" fill-opacity="0.06"/>
    <text x="16" y="24" class="trlabel" fill="#06b6d4" font-size="14">RUNTIME</text>
    <circle cx="210" cy="18" r="4" fill="#06b6d4" class="trpulse" style="animation-delay:0.6s"/>
    <line x1="0" y1="36" x2="230" y2="36" stroke="#06b6d4" stroke-opacity="0.2"/>
    <g class="trmono" font-size="13" fill="#cffafe">
      <text x="16" y="62">TypeScript / Node</text>
      <text x="16" y="84">Python / FastAPI</text>
      <text x="16" y="106">Rust / Cargo</text>
      <text x="16" y="128">Go / Cobra</text>
      <text x="16" y="150">Express / Zod</text>
      <text x="16" y="172">Pydantic</text>
    </g>
  </g>

  <!-- Frontend Quadrant (bottom-left) -->
  <g transform="translate(60 290)" filter="url(#trsmall)">
    <rect width="230" height="180" rx="14" fill="#020617" fill-opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect width="230" height="36" rx="14" fill="#8b5cf6" fill-opacity="0.06"/>
    <text x="16" y="24" class="trlabel" fill="#8b5cf6" font-size="14">FRONTEND</text>
    <circle cx="210" cy="18" r="4" fill="#8b5cf6" class="trpulse" style="animation-delay:1.2s"/>
    <line x1="0" y1="36" x2="230" y2="36" stroke="#8b5cf6" stroke-opacity="0.2"/>
    <g class="trmono" font-size="13" fill="#ddd6fe">
      <text x="16" y="62">React / Next.js</text>
      <text x="16" y="84">Vite / Tailwind</text>
      <text x="16" y="106">Three.js / WebGL</text>
      <text x="16" y="128">shadcn/ui</text>
      <text x="16" y="150">Framer Motion</text>
      <text x="16" y="172">Responsive Design</text>
    </g>
  </g>

  <!-- Proof Quadrant (bottom-right) -->
  <g transform="translate(910 290)" filter="url(#trsmall)">
    <rect width="230" height="180" rx="14" fill="#020617" fill-opacity="0.85" stroke="#f97316" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect width="230" height="36" rx="14" fill="#f97316" fill-opacity="0.06"/>
    <text x="16" y="24" class="trlabel" fill="#f97316" font-size="14">PROOF &amp; OPS</text>
    <circle cx="210" cy="18" r="4" fill="#f97316" class="trpulse" style="animation-delay:1.8s"/>
    <line x1="0" y1="36" x2="230" y2="36" stroke="#f97316" stroke-opacity="0.2"/>
    <g class="trmono" font-size="13" fill="#fed7aa">
      <text x="16" y="62">Playwright E2E</text>
      <text x="16" y="84">Docker / Compose</text>
      <text x="16" y="106">Prometheus</text>
      <text x="16" y="128">GitHub Actions</text>
      <text x="16" y="150">MCP Protocol</text>
      <text x="16" y="172">Chaos Testing</text>
    </g>
  </g>

  <!-- Connecting lines from center to quadrants -->
  <g opacity="0.3">
    <line x1="400" y1="170" x2="290" y2="170" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="800" y1="170" x2="910" y2="170" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="400" y1="380" x2="290" y2="380" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="800" y1="380" x2="910" y2="380" stroke="#f97316" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Center label -->
  <g filter="url(#trglow)">
    <circle cx="600" cy="290" r="28" fill="#020617" stroke="url(#trneon)" stroke-width="2"/>
    <text x="600" y="295" text-anchor="middle" class="trmono" fill="#f8fafc" font-size="12" font-weight="bold">CORE</text>
  </g>

  <rect x="10" y="10" width="1180" height="500" rx="20" fill="none" stroke="url(#trneon)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>