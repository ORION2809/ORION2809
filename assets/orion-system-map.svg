<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ORION2809 agentic system map</title>
  <desc id="desc">A neon system map connecting research signals, typed plans, agentic build loops, browser validation, polished shipping, and reusable systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.54" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#03120b"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.52" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#22c55e" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 2px; }
      .node { filter: url(#glow); }
      .dash { stroke-dasharray: 10 14; animation: dash 9s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -240; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <text x="44" y="58" class="mono" fill="#22c55e" font-size="20">SYSTEM MAP // RESEARCH TO REUSABLE MACHINERY</text>
  <text x="44" y="86" class="mono" fill="#94a3b8" font-size="15">no vibes-only shipping: plan, build, test in a browser, fold the pattern back into the stack</text>

  <path class="dash" d="M106 210 H292 H474 H656 H838 H1020" fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round"/>
  <path d="M292 210 C330 120 440 116 474 210" fill="none" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M838 210 C796 314 694 318 656 210" fill="none" stroke="#f97316" stroke-opacity="0.45" stroke-width="2"/>

  <g class="node">
    <rect x="44" y="148" width="178" height="124" rx="12" fill="#020617" stroke="#22c55e" stroke-width="2"/>
    <text x="133" y="190" text-anchor="middle" class="label" fill="#f8fafc" font-size="17">RESEARCH</text>
    <text x="133" y="222" text-anchor="middle" class="mono" fill="#bbf7d0" font-size="15">signals</text>
    <text x="133" y="246" text-anchor="middle" class="mono" fill="#94a3b8" font-size="13">Career-Ops</text>
  </g>

  <g class="node">
    <rect x="226" y="148" width="178" height="124" rx="12" fill="#020617" stroke="#06b6d4" stroke-width="2"/>
    <text x="315" y="190" text-anchor="middle" class="label" fill="#f8fafc" font-size="17">CONTRACT</text>
    <text x="315" y="222" text-anchor="middle" class="mono" fill="#cffafe" font-size="15">typed plan</text>
    <text x="315" y="246" text-anchor="middle" class="mono" fill="#94a3b8" font-size="13">Pydantic, Zod</text>
  </g>

  <g class="node">
    <rect x="408" y="148" width="178" height="124" rx="12" fill="#020617" stroke="#22c55e" stroke-width="2"/>
    <text x="497" y="190" text-anchor="middle" class="label" fill="#f8fafc" font-size="17">AGENTS</text>
    <text x="497" y="222" text-anchor="middle" class="mono" fill="#bbf7d0" font-size="15">build loop</text>
    <text x="497" y="246" text-anchor="middle" class="mono" fill="#94a3b8" font-size="13">Claw, Fulcrum</text>
  </g>

  <g class="node">
    <rect x="590" y="148" width="178" height="124" rx="12" fill="#020617" stroke="#06b6d4" stroke-width="2"/>
    <text x="679" y="190" text-anchor="middle" class="label" fill="#f8fafc" font-size="17">BROWSER</text>
    <text x="679" y="222" text-anchor="middle" class="mono" fill="#cffafe" font-size="15">validation</text>
    <text x="679" y="246" text-anchor="middle" class="mono" fill="#94a3b8" font-size="13">Playwright</text>
  </g>

  <g class="node">
    <rect x="772" y="148" width="178" height="124" rx="12" fill="#020617" stroke="#f97316" stroke-width="2"/>
    <text x="861" y="190" text-anchor="middle" class="label" fill="#f8fafc" font-size="17">SHIP</text>
    <text x="861" y="222" text-anchor="middle" class="mono" fill="#fed7aa" font-size="15">polished output</text>
    <text x="861" y="246" text-anchor="middle" class="mono" fill="#94a3b8" font-size="13">live proof</text>
  </g>

  <g class="node">
    <rect x="954" y="148" width="202" height="124" rx="12" fill="#020617" stroke="#22c55e" stroke-width="2"/>
    <text x="1055" y="190" text-anchor="middle" class="label" fill="#f8fafc" font-size="17">COMPOUND</text>
    <text x="1055" y="222" text-anchor="middle" class="mono" fill="#bbf7d0" font-size="15">reusable system</text>
    <text x="1055" y="246" text-anchor="middle" class="mono" fill="#94a3b8" font-size="13">skills, MCPs, CLIs</text>
  </g>

  <g class="mono" font-size="15" fill="#f8fafc">
    <rect x="138" y="315" width="214" height="44" rx="8" fill="#020617" stroke="#22c55e" stroke-opacity="0.72"/>
    <text x="162" y="343">Prove-It-Mode</text>
    <rect x="394" y="315" width="214" height="44" rx="8" fill="#020617" stroke="#06b6d4" stroke-opacity="0.72"/>
    <text x="418" y="343">Game Builder</text>
    <rect x="650" y="315" width="214" height="44" rx="8" fill="#020617" stroke="#f97316" stroke-opacity="0.72"/>
    <text x="674" y="343">AI Onboarding</text>
    <rect x="906" y="315" width="214" height="44" rx="8" fill="#020617" stroke="#22c55e" stroke-opacity="0.72"/>
    <text x="930" y="343">Claude Fulcrum</text>
  </g>

  <rect x="12" y="12" width="1176" height="396" rx="20" fill="none" stroke="url(#wire)" stroke-opacity="0.8" stroke-width="2"/>
</svg>
