<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">ORION2809 project constellation</title>
  <desc id="desc">A neon constellation showing six current GitHub projects connected as a launch bay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#03120b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .node { filter: url(#glow); }
      .ping { animation: ping 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes ping { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    </style>
  </defs>
  <rect width="1200" height="310" rx="22" fill="url(#bg)"/>
  <path d="M95 185 L265 95 L438 164 L615 78 L792 168 L975 92 L1090 172" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <path d="M95 185 C310 270 450 246 615 78 C705 32 820 54 975 92" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 12" opacity=".45"/>
  <g class="mono" fill="#f8fafc" text-anchor="middle">
    <g class="node">
      <circle cx="95" cy="185" r="34" fill="#020617" stroke="#22c55e" stroke-width="3"/>
      <circle class="ping" cx="95" cy="185" r="48" fill="none" stroke="#22c55e" stroke-width="1"/>
      <text x="95" y="238" font-size="15">Career-Ops</text>
    </g>
    <g class="node">
      <circle cx="265" cy="95" r="34" fill="#020617" stroke="#06b6d4" stroke-width="3"/>
      <circle class="ping" cx="265" cy="95" r="48" fill="none" stroke="#06b6d4" stroke-width="1"/>
      <text x="265" y="154" font-size="15">Prove-It</text>
    </g>
    <g class="node">
      <circle cx="438" cy="164" r="34" fill="#020617" stroke="#22c55e" stroke-width="3"/>
      <text x="438" y="218" font-size="15">Claw Code</text>
    </g>
    <g class="node">
      <circle cx="615" cy="78" r="40" fill="#020617" stroke="#f97316" stroke-width="3"/>
      <circle class="ping" cx="615" cy="78" r="56" fill="none" stroke="#f97316" stroke-width="1"/>
      <text x="615" y="148" font-size="15">Fulcrum</text>
    </g>
    <g class="node">
      <circle cx="792" cy="168" r="34" fill="#020617" stroke="#06b6d4" stroke-width="3"/>
      <text x="792" y="222" font-size="15">Onboarding</text>
    </g>
    <g class="node">
      <circle cx="975" cy="92" r="34" fill="#020617" stroke="#22c55e" stroke-width="3"/>
      <circle class="ping" cx="975" cy="92" r="48" fill="none" stroke="#22c55e" stroke-width="1"/>
      <text x="975" y="50" font-size="15">Game Builder</text>
    </g>
    <g class="node">
      <circle cx="1090" cy="172" r="28" fill="#020617" stroke="#f97316" stroke-width="3"/>
      <text x="1090" y="226" font-size="15">RLRAG</text>
    </g>
  </g>
  <text x="42" y="48" class="mono" fill="#22c55e" font-size="18">LATEST LAUNCH BAY // LIVE REPO CONSTELLATION</text>
  <text x="42" y="76" class="mono" fill="#94a3b8" font-size="14">agentic tooling - learning diagnostics - orchestration - browser-proof validation</text>
  <rect x="12" y="12" width="1176" height="286" rx="18" fill="none" stroke="url(#line)" stroke-opacity=".72" stroke-width="2"/>
</svg>
