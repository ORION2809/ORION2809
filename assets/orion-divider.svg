<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" role="img" aria-label="Neon section divider">
  <defs>
    <linearGradient id="dg" x1="0" x2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.15" stop-color="#22c55e"/>
      <stop offset="0.35" stop-color="#06b6d4"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="0.75" stop-color="#f97316"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="dglow" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ddash{stroke-dasharray:8 6 2 6;animation:ddash 4s linear infinite}
      @keyframes ddash{to{stroke-dashoffset:-220}}
    </style>
  </defs>
  <line x1="60" y1="14" x2="1140" y2="14" stroke="url(#dg)" stroke-width="1.5" opacity="0.5" filter="url(#dglow)"/>
  <line class="ddash" x1="60" y1="14" x2="1140" y2="14" stroke="url(#dg)" stroke-width="1" opacity="0.7" filter="url(#dglow)"/>
  <circle cx="600" cy="14" r="4" fill="#06b6d4" opacity="0.8"/>
  <circle cx="600" cy="14" r="2" fill="#f8fafc"/>
</svg>